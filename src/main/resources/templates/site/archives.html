<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org" th:with="title='Archives|归档'">
<div th:replace="~{site/head :: head(${title})}"></div>
<body class="template-archives">
<script>
(function() {
    const colorSchemeKey = 'StackColorScheme';
    if(!localStorage.getItem(colorSchemeKey)){
        localStorage.setItem(colorSchemeKey, "auto");
    }
})();
</script><script>
    (function() {
        const colorSchemeKey = 'StackColorScheme';
        const colorSchemeItem = localStorage.getItem(colorSchemeKey);
        const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches === true;

        if (colorSchemeItem == 'dark' || colorSchemeItem === 'auto' && supportDarkMode) {


            document.documentElement.dataset.scheme = 'dark';
        } else {
            document.documentElement.dataset.scheme = 'light';
        }
    })();
</script>
<div class="container main-container flex on-phone--column extended">
    <div th:replace="~{site/left-aside :: left-aside}"></div>
    <main class="main full-width">
        <header>
            <h2 class="section-title">分类</h2>
            <div class="subsection-list">
                <div class="article-list--tile">
                    <th:block th:each="category : ${categorys}">
                        <th:block th:if="${category.pic != null}">
                            <article class="has-image">
                                <a th:href="@{/categories/{mname}(mname=${category.mname})}">
                                    <div class="article-image">
                                        <img th:src="${category.pic}"
                                             width="250"
                                             height="150"
                                             loading="lazy"
                                             alt="Featured image of post Test"
                                             data-key="test"
                                             data-hash="md5-vsif6ZlY2JQT7cD5Noi91g==">
                                    </div>
                                    <div class="article-details">
                                        <h2 class="article-title" th:text="${category.mname}"></h2>
                                    </div>
                                </a>
                            </article>
                        </th:block>
                        <th:block th:unless="${category.pic != null}">
                            <article class="">
                                <a th:href="@{/categories/{mname}(mname=${category.mname})}">
                                    <div class="article-details">
                                        <h2 class="article-title" th:text="${category.mname}"></h2>
                                    </div>
                                </a>
                            </article>
                        </th:block>
                    </th:block>
                </div>
            </div>

        </header>




        <th:block th:each="archive : ${archivesMap}">
            <div class="archives-group" th:id="${archive.key}">
                <h2 class="archives-date section-title"><a th:href="@{/archives/{year}(year=${archive.key})}" th:text="${archive.key}">2019</a></h2>
                <div class="article-list--compact">
                    <th:block th:each="article : ${archive.value}">
                        <th:block th:if="${article.coverPic != null}">
                            <article>
                                <a th:href="@{/article/{aid}(aid=${article.aid})}">
                                    <div class="article-details">
                                        <h2 class="article-title" th:text="${article.title}"></h2>
                                        <footer class="article-time">
                                            <time datetime='2019-03-11T00:00:00Z' th:text="${#dates.format(new java.util.Date(article.create_time), 'yyyy-MM-dd')}"></time>
                                        </footer>
                                    </div>
                                    <div class="article-image">
                                        <img th:src="${article.coverPic}"
                                             width="120"
                                             height="120"
                                             alt="Markdown Syntax Guide"
                                             loading="lazy">

                                    </div>

                                </a>
                            </article>
                        </th:block>
                        <th:block th:unless="${article.coverPic != null}">
                            <article>
                                <a th:href="@{/article/{aid}(aid=${article.aid})}">
                                    <div class="article-details">
                                        <h2 class="article-title" th:text="${article.title}">Math Typesetting</h2>
                                        <footer class="article-time">
                                            <time datetime='2019-03-08T00:00:00Z' th:text="${#dates.format(new java.util.Date(article.create_time), 'yyyy-MM-dd')}">Mar 08, 2019</time>
                                        </footer>
                                    </div>
                                </a>
                            </article>
                        </th:block>
                    </th:block>



                </div>
            </div>
        </th:block>


        <footer class="site-footer">
            <section class="copyright">
                &copy;

                2024 -

                2025 fengdeyan
            </section>

            <section class="powerby">
                Theme <b><a href="https://github.com/CaiJimmy/hugo-theme-stack" target="_blank" rel="noopener" data-version="3.31.0">Stack</a></b> designed by <a href="https://jimmycai.com" target="_blank" rel="noopener">Jimmy</a>
            </section>
        </footer>


    </main>
</div>
<div id="particles-js"></div>
<script src="/site/js/particles.min.js"></script>
<!-- 初始化特效 -->
<script>
    particlesJS.load('particles-js', '/site/js/particlesjs-config.json', function() {
        console.log('particles.js loaded - callback');
    });
</script>

<style>
    #particles-js {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }
</style>
<script
        src="https://cdn.jsdelivr.net/npm/node-vibrant@3.1.6/dist/vibrant.min.js"integrity="sha256-awcR2jno4kI5X0zL8ex0vi2z&#43;KMkF24hUW8WePSA9HM="crossorigin="anonymous"

>
</script><script type="text/javascript" src="/ts/main.99b18171c7f951e7d13c8997de5f6e7770f4fad01e8fb682f6df8f8d83da995b.js" defer></script>
<script>
    (function () {
        const customFont = document.createElement('link');
        customFont.href = "https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap";

        customFont.type = "text/css";
        customFont.rel = "stylesheet";

        document.head.appendChild(customFont);
    }());
</script>

</body>
</html>
