    <script src="/live2D/autoload.js"></script>
    <script>
        // 等待页面 DOM 加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 获取当前页面的路径（例如：当前页面是 /about/，则 pathname 是 "/about/"）
            const currentPath = window.location.pathname;

            console.log('currentPath'+currentPath);
            // 2. 获取所有导航项的 <a> 标签
            const menuLinks = document.querySelectorAll('#main-menu li a');

            // 3. 遍历每个导航项，匹配路径
            menuLinks.forEach(link => {
                // 获取导航项的 href 属性值（例如："/about/"）
                const linkHref = link.getAttribute('href');

                // 关键：匹配路径（支持精确匹配和首页特殊处理）
                // 情况1：首页（/）特殊处理（避免和其他路径冲突）
                if (currentPath === '/' && linkHref === '/') {
                    link.parentElement.classList.add('current');
                }
                // 情况2：其他页面（如 /about/、/archives/）精确匹配
                else if (currentPath === linkHref) {
                    link.parentElement.classList.add('current');
                }
            });
        });
    </script>
