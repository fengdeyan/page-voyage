<!DOCTYPE html>
<html lang="zh-CN" dir="ltr" xmlns:th="http://www.thymeleaf.org" th:with="title='AI智能检索'">
<div th:replace="~{site/head :: head(${title})}"></div>
<body class="template-ai-search">
<script>
    (function() {
        const colorSchemeKey = 'StackColorScheme';
        if(!localStorage.getItem(colorSchemeKey)){
            localStorage.setItem(colorSchemeKey, "auto");
        }
    })();
</script>
<script>
    (function() {
        const colorSchemeKey = 'StackColorScheme';
        const colorSchemeItem = localStorage.getItem(colorSchemeKey);
        const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches === true;

        if (colorSchemeItem == 'dark' || colorSchemeItem === 'auto' && supportDarkMode) {
            document.documentElement.dataset.scheme = 'dark';
        } else {
            document.documentElement.dataset.scheme = 'light';
        }
    })();
</script>
<div class="container main-container flex on-phone--column extended">
    <div th:replace="~{site/left-aside :: left-aside}"></div>
    <main class="main full-width">
        <div class="ai-search-container">
            <div class="ai-search-header">
                <div class="ai-icon-wrapper">
                    <div class="ai-icon-glow"></div>
                    <div class="ai-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-brain" width="56" height="56" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z"/>
                            <path d="M12 4.5a2.5 2.5 0 0 0 -4.96 -.46a2.5 2.5 0 0 0 -1.98 3.14a2.5 2.5 0 0 0 .5 4a2.5 2.5 0 0 0 2.96 1.46a2.5 2.5 0 0 0 2.96 -1.46a2.5 2.5 0 0 0 .5 -4a2.5 2.5 0 0 0 -1.98 -3.14a2.5 2.5 0 0 0 -4.96 .46"/>
                            <path d="M12 19.5a2.5 2.5 0 0 0 4.96 .46a2.5 2.5 0 0 0 1.98 -3.14a2.5 2.5 0 0 0 -.5 -4a2.5 2.5 0 0 0 -2.96 -1.46a2.5 2.5 0 0 0 -2.96 1.46a2.5 2.5 0 0 0 -.5 4a2.5 2.5 0 0 0 1.98 3.14a2.5 2.5 0 0 0 4.96 -.46"/>
                            <path d="M15.5 15.5l-7 1"/>
                            <path d="M8.5 12.5l7 -1"/>
                        </svg>
                    </div>
                </div>
                <h1 class="ai-title">
                    <span class="ai-prefix">AI</span>智能文章检索
                </h1>
                <p class="ai-subtitle">基于深度学习的智能语义理解引擎</p>
                
                <div class="ai-features">
                    <div class="feature-tag">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-lightbulb" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z"/>
                            <circle cx="12" cy="13" r="7" />
                            <line x1="12" y1="19" x2="12" y2="23" />
                            <line x1="8" y1="21" x2="16" y2="21" />
                        </svg>
                        <span>自然语言理解</span>
                    </div>
                    <div class="feature-tag">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-network" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z"/>
                            <circle cx="12" cy="12" r="3" />
                            <circle cx="19" cy="6" r="3" />
                            <circle cx="5" cy="6" r="3" />
                            <circle cx="19" cy="18" r="3" />
                            <circle cx="5" cy="18" r="3" />
                            <line x1="12" y1="15" x2="19" y2="15" />
                            <line x1="12" y1="9" x2="19" y2="9" />
                            <line x1="5" y1="9" x2="12" y2="9" />
                            <line x1="5" y1="15" x2="12" y2="15" />
                        </svg>
                        <span>语义扩展匹配</span>
                    </div>
                    <div class="feature-tag">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-brain-circuit" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z"/>
                            <path d="M12 4a8 8 0 0 0 -8 8a8 8 0 0 0 8 8a8 8 0 0 0 8 -8a8 8 0 0 0 -8 -8" />
                            <path d="M12 8l4 2l-2 4l-4 -2l2 -4" />
                            <circle cx="12" cy="12" r="2" />
                            <circle cx="6" cy="10" r="1" />
                            <circle cx="18" cy="10" r="1" />
                            <circle cx="8" cy="16" r="1" />
                            <circle cx="16" cy="16" r="1" />
                        </svg>
                        <span>智能问答分析</span>
                    </div>
                    <div class="feature-tag">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-trending-up" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z"/>
                            <polyline points="3 18 9 12 15 15 21 6" />
                            <path d="M21 18v-3a6 6 0 0 0 -6 -6H3" />
                        </svg>
                        <span>实时学习优化</span>
                    </div>
                </div>
            </div>

            <div class="search-input-wrapper">
                <div class="search-input-container">
                    <div class="ai-avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-robot" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z"/>
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <circle cx="7" cy="11" r="2" />
                            <circle cx="17" cy="11" r="2" />
                            <line x1="7" y1="17" x2="17" y2="17" />
                            <line x1="7" y1="15" x2="7" y2="17" />
                            <line x1="17" y1="15" x2="17" y2="17" />
                        </svg>
                    </div>
                    <input 
                        id="ai-search-input" 
                        type="text" 
                        placeholder="请问您想了解什么？比如：如何学习Java编程？什么是JVM？" 
                        class="search-input"
                        maxlength="200"
                    />
                    <button id="ai-search-submit" class="search-submit-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-send" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z"/>
                            <line x1="10" y1="14" x2="21" y2="3" />
                            <path d="M21 3l-7.586 7.586a2 2 0 0 1 -2.828 0l-11.172-11.172a5 5 0 0 1 7.071 7.071l3.586 3.586a2 2 0 0 0 2.828 0l7.586-7.586a4.993 4.993 0 0 1 0 7.07" />
                        </svg>
                    </button>
                </div>
                <div id="input-error" class="input-error"></div>
                <div class="input-hint">
                    <span class="char-count">0/200</span>
                    <span class="hint-text">💡 支持自然语言提问，AI会智能分析您的问题意图</span>
                </div>
                
                <div class="suggestion-tags">
                    <span class="suggestion-label">试试这些问题：</span>
                    <button class="suggestion-tag" onclick="setSuggestion('如何学习Java编程？')">如何学习Java编程？</button>
                    <button class="suggestion-tag" onclick="setSuggestion('什么是微服务架构？')">什么是微服务架构？</button>
                    <button class="suggestion-tag" onclick="setSuggestion('如何优化数据库性能？')">如何优化数据库性能？</button>
                    <button class="suggestion-tag" onclick="setSuggestion('Redis缓存策略有哪些？')">Redis缓存策略有哪些？</button>
                </div>
            </div>

            <div id="thinking-container" class="thinking-container hidden">
                <div class="thinking-content">
                    <div class="thinking-bubble">
                        <div class="thinking-dots">
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                        <p class="thinking-text" id="thinking-text">AI正在分析您的问题...</p>
                    </div>
                    <div class="analysis-steps">
                        <div class="step active">
                            <span class="step-number">1</span>
                            <span class="step-text">理解问题意图</span>
                        </div>
                        <div class="step">
                            <span class="step-number">2</span>
                            <span class="step-text">扩展语义关键词</span>
                        </div>
                        <div class="step">
                            <span class="step-number">3</span>
                            <span class="step-text">智能匹配文章</span>
                        </div>
                        <div class="step">
                            <span class="step-number">4</span>
                            <span class="step-text">排序优化结果</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="ai-answer-panel" class="ai-answer-panel hidden">
                <div class="ai-answer-header">
                    <div class="ai-avatar-small">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-bot" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z"/>
                            <circle cx="12" cy="12" r="9" />
                            <path d="M12 16v-4" />
                            <path d="M8 12l2 -2" />
                            <path d="M16 12l-2 -2" />
                        </svg>
                    </div>
                    <div class="answer-header-info">
                        <span class="answer-title">AI智能回答</span>
                        <div class="answer-meta">
                            <span id="answer-type" class="answer-type">通用回答</span>
                            <span id="answer-confidence" class="confidence-badge">置信度: 高</span>
                        </div>
                    </div>
                </div>
                <div class="ai-answer-content">
                    <p id="ai-answer-text" class="answer-text"></p>
                </div>
                <div id="answer-sources" class="answer-sources hidden">
                    <div class="sources-label">参考来源：</div>
                    <div id="sources-list" class="sources-list"></div>
                </div>
            </div>

            <div id="search-results" class="search-results hidden">
                <div class="results-header">
                    <div class="results-summary">
                        <h2 class="results-title">
                            <span id="results-count">0</span> 篇相关文章
                            <span id="response-time" class="response-time"></span>
                        </h2>
                        <p class="results-query">您的提问：<span id="query-display"></span></p>
                    </div>
                </div>

                <div id="results-list" class="results-list">
                    <div th:each="result : ${results}" class="result-item">
                        <article class="article-card">
                            <a th:href="@{/article/{aid}(aid=${result.aid})}" class="article-link">
                                <div th:if="${result.coverPic != null}" class="article-cover">
                                    <img th:src="${result.coverPic}" alt="${result.title}" loading="lazy" />
                                </div>
                                <div class="article-info">
                                    <div class="article-ranking">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-award" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                            <path stroke="none" d="M0 0h24v24H0z"/>
                                            <circle cx="12" cy="9" r="6" />
                                            <path d="M12 15l-3 4h6l-3 -4" />
                                            <circle cx="12" cy="9" r="3" />
                                        </svg>
                                    </div>
                                    <h3 class="article-title" th:text="${result.title}"></h3>
                                    <p class="article-snippet" th:text="${result.highlightSnippet}"></p>
                                    <div class="article-meta">
                                        <span class="article-category" th:text="${result.category}"></span>
                                        <span class="article-date" th:text="${#dates.format(new java.util.Date(result.create_time), 'yyyy-MM-dd')}"></span>
                                        <div class="relevance-badge">
                                            <span class="relevance-label">相关性</span>
                                            <span class="relevance-score" th:text="${result.relevanceScore}"></span>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </article>
                    </div>
                </div>

                <div id="empty-results" class="empty-results hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-search-x" width="64" height="64" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z"/>
                        <circle cx="10" cy="10" r="7" />
                        <line x1="21" y1="21" x2="15" y2="15" />
                        <line x1="15" y1="9" x2="9" y2="15" />
                        <line x1="9" y1="9" x2="15" y2="15" />
                    </svg>
                    <h3>未找到匹配的文章</h3>
                    <p>请尝试使用其他关键词或调整提问方式</p>
                    <div class="empty-suggestions">
                        <span>建议尝试：</span>
                        <button class="suggestion-tag" onclick="setSuggestion('Java入门教程')">Java入门教程</button>
                        <button class="suggestion-tag" onclick="setSuggestion('Spring Boot实战')">Spring Boot实战</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <section class="copyright">
                © 2024 - 2025 fengdeyan
            </section>
            <section class="powerby">
                Theme <b><a href="https://github.com/CaiJimmy/hugo-theme-stack" target="_blank" rel="noopener" data-version="3.31.0">Stack</a></b> designed by <a href="https://jimmycai.com" target="_blank" rel="noopener">Jimmy</a>
            </section>
        </footer>
    </main>
</div>

<script>
function setSuggestion(text) {
    document.getElementById('ai-search-input').value = text;
    document.getElementById('ai-search-submit').disabled = false;
}

document.addEventListener('DOMContentLoaded', function() {
    const input = document.getElementById('ai-search-input');
    const submitBtn = document.getElementById('ai-search-submit');
    const errorDiv = document.getElementById('input-error');
    const charCount = document.querySelector('.char-count');
    const thinkingContainer = document.getElementById('thinking-container');
    const thinkingText = document.getElementById('thinking-text');
    const searchResults = document.getElementById('search-results');
    const resultsList = document.getElementById('results-list');
    const emptyResults = document.getElementById('empty-results');
    const resultsCount = document.getElementById('results-count');
    const responseTime = document.getElementById('response-time');
    const queryDisplay = document.getElementById('query-display');
    const aiAnswerPanel = document.getElementById('ai-answer-panel');
    const aiAnswerText = document.getElementById('ai-answer-text');
    const answerType = document.getElementById('answer-type');
    const answerConfidence = document.getElementById('answer-confidence');
    const answerSources = document.getElementById('answer-sources');
    const sourcesList = document.getElementById('sources-list');
    const steps = document.querySelectorAll('.step');

    input.addEventListener('input', function() {
        const value = this.value.trim();
        
        charCount.textContent = this.value.length + '/200';
        
        if (value.length === 0) {
            submitBtn.disabled = true;
            errorDiv.textContent = '';
        } else if (value.length < 2) {
            submitBtn.disabled = true;
            errorDiv.textContent = '请输入至少2个字符';
            errorDiv.style.display = 'block';
        } else {
            submitBtn.disabled = false;
            errorDiv.textContent = '';
            errorDiv.style.display = 'none';
        }
    });

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !submitBtn.disabled) {
            performSearch();
        }
    });

    submitBtn.addEventListener('click', performSearch);

    let stepIndex = 0;
    let thinkingInterval = null;

    function startThinkingAnimation() {
        stepIndex = 0;
        steps.forEach((step, index) => {
            step.classList.remove('active', 'completed');
            if (index < stepIndex) step.classList.add('completed');
        });
        
        thinkingInterval = setInterval(() => {
            if (stepIndex < steps.length) {
                steps[stepIndex].classList.add('active');
                if (stepIndex > 0) {
                    steps[stepIndex - 1].classList.remove('active');
                    steps[stepIndex - 1].classList.add('completed');
                }
                stepIndex++;
            }
        }, 600);
    }

    function stopThinkingAnimation() {
        if (thinkingInterval) {
            clearInterval(thinkingInterval);
            thinkingInterval = null;
        }
        steps.forEach((step, index) => {
            step.classList.remove('active');
            step.classList.add('completed');
        });
    }

    function performSearch() {
        const query = input.value.trim();
        
        if (query.length < 2) {
            errorDiv.textContent = '请输入至少2个字符';
            errorDiv.style.display = 'block';
            return;
        }

        thinkingContainer.classList.remove('hidden');
        aiAnswerPanel.classList.add('hidden');
        searchResults.classList.add('hidden');
        startThinkingAnimation();
        
        fetch('/ai-search/api/search?query=' + encodeURIComponent(query) + '&limit=10')
            .then(response => response.json())
            .then(data => {
                stopThinkingAnimation();
                    
                    setTimeout(() => {
                        thinkingContainer.classList.add('hidden');
                        
                        if (data.success && data.data) {
                            if (data.data.aiAnswer && data.data.aiAnswer.answer) {
                                aiAnswerPanel.classList.remove('hidden');
                            }
                            searchResults.classList.remove('hidden');
                        } else {
                            searchResults.classList.remove('hidden');
                        }
                    }, 300);
                    
                    queryDisplay.textContent = query;

                    if (data.success && data.data) {
                        const aiAnswer = data.data.aiAnswer;
                        
                        if (aiAnswer && aiAnswer.answer) {
                            aiAnswerText.textContent = aiAnswer.answer;
                            answerType.textContent = aiAnswer.answerType || '通用回答';
                            
                            const confidence = aiAnswer.confidence || '中';
                            answerConfidence.textContent = '置信度: ' + confidence;
                            answerConfidence.className = 'confidence-badge confidence-' + confidence.toLowerCase();
                            
                            if (aiAnswer.sources && aiAnswer.sources.length > 0) {
                                answerSources.classList.remove('hidden');
                                sourcesList.innerHTML = aiAnswer.sources.map(source => 
                                    `<span class="source-item">${source}</span>`
                                ).join('');
                            } else {
                                answerSources.classList.add('hidden');
                            }
                        }
                        
                        responseTime.textContent = '(' + data.data.responseTime + 'ms)';

                        if (data.data.matches && data.data.matches.length > 0) {
                            emptyResults.classList.add('hidden');
                            resultsCount.textContent = data.data.matches.length;
                            renderResults(data.data.matches);
                        } else {
                            resultsList.innerHTML = '';
                            emptyResults.classList.remove('hidden');
                            resultsCount.textContent = '0';
                        }
                    } else {
                        resultsList.innerHTML = '';
                        emptyResults.classList.remove('hidden');
                        resultsCount.textContent = '0';
                        responseTime.textContent = '';
                    }
            })
            .catch(error => {
                stopThinkingAnimation();
                thinkingContainer.classList.add('hidden');
                searchResults.classList.remove('hidden');
                emptyResults.classList.remove('hidden');
                resultsCount.textContent = '0';
                responseTime.textContent = '';
                console.error('搜索失败:', error);
            });
    }

    function renderResults(matches) {
        resultsList.innerHTML = matches.map((match, index) => `
            <article class="article-card">
                <a href="/article/${match.aid}" class="article-link">
                    ${match.coverPic ? `
                        <div class="article-cover">
                            <img src="${match.coverPic}" alt="${match.title}" loading="lazy" />
                        </div>
                    ` : ''}
                    <div class="article-info">
                        <div class="article-ranking">
                            <span class="rank-number">${index + 1}</span>
                        </div>
                        <h3 class="article-title">${match.title}</h3>
                        <p class="article-snippet">${match.highlightSnippet || (match.content ? match.content.substring(0, 120) + '...' : '暂无摘要')}</p>
                        <div class="article-meta">
                            <span class="article-category">${match.category || '未分类'}</span>
                            <span class="article-date">${formatDate(match.create_time)}</span>
                            <div class="relevance-badge">
                                <span class="relevance-label">相关性</span>
                                <span class="relevance-score">${match.relevanceScore}</span>
                            </div>
                        </div>
                    </div>
                </a>
            </article>
        `).join('');
    }

    function formatDate(timestamp) {
        if (!timestamp) return '未知';
        const date = new Date(timestamp);
        return date.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        });
    }
});
</script>

<style>
.ai-search-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
    width: 100%;
}

.ai-search-header {
    text-align: center;
    margin-bottom: 40px;
}

.ai-icon-wrapper {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
}

.ai-icon-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
    border-radius: 50%;
    animation: glowPulse 2s ease-in-out infinite;
}

@keyframes glowPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
}

.ai-icon {
    position: relative;
    z-index: 1;
    color: #6366f1;
}

.ai-title {
    font-size: 3rem;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 15px;
}

.ai-prefix {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.ai-subtitle {
    font-size: 1.3rem;
    color: #64748b;
    margin-bottom: 25px;
}

.ai-features {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
}

.feature-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
    color: #4f46e5;
    padding: 8px 18px;
    border-radius: 25px;
    font-size: 1rem;
    font-weight: 500;
}

.search-input-wrapper {
    margin-bottom: 30px;
}

.search-input-container {
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
    padding: 8px;
